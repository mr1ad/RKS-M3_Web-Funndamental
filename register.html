<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold text-center mb-5">Register</h1>

        <form id="registerForm" action="dashboard.html">
            <label>Username</label>
            <input id="username" type="text"
                class="w-full border p-2 mb-2" placeholder="Username">
            <p id="usernameError" class="text-red-500 text-sm"></p>

            <label>Password</label>
            <input id="password" type="password"
                class="w-full border p-2 mb-2" placeholder="Password">
            <p id="passwordError" class="text-red-500 text-sm"></p>

            <label>Nama</label>
            <input id="nama" type="text"
                class="w-full border p-2 mb-2" placeholder="Nama">
            <p id="namaError" class="text-red-500 text-sm"></p>

            <label>Tanggal Lahir</label>
            <input id="tanggalLahir" type="date"
                class="w-full border p-2 mb-2">
            <p id="tanggalLahirError" class="text-red-500 text-sm"></p>

            <label>Alamat</label>
            <textarea id="alamat"
                class="w-full border p-2 mb-2" placeholder="Alamat"></textarea>
            <p id="alamatError" class="text-red-500 text-sm"></p>

            <label>Nomor Telepon</label>
            <input id="telepon" type="text"
                class="w-full border p-2 mb-4" placeholder="628123456789">
            <p id="teleponError" class="text-red-500 text-sm"></p>

            <button type="submit"
                class="w-full bg-blue-500 text-white p-2 rounded">
                Register
            </button>
        </form>
    </div>

    <script src="validasi_input.js"></script>
</body>
</html>
